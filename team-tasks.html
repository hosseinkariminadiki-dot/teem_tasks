<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15232B">
<title>تقسیم کار تیم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--ink:#15232B;--muted:#5E6F76;--line:#D3DCDD;--teal:#1F7A6D;--teal-soft:#D5EBE7;--sun:#E8A33D;--sun-soft:#FBEBCF;--brick:#B4452F}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding-bottom:92px}
header{padding:22px 16px 6px;max-width:640px;margin:0 auto}
h1{font-size:24px;font-weight:800}
header p{color:var(--muted);font-size:14px}
main{padding:0 16px 24px;max-width:640px;margin:0 auto}
h2{font-size:18px;font-weight:800;margin:18px 0 4px}
.muted{color:var(--muted);font-size:14px}
.bad-t{color:var(--brick);font-size:14px;font-weight:600}
.empty{color:var(--muted);padding:14px 0}
.row{padding:14px 0;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.acts{display:flex;gap:16px;margin-top:4px}
.tag{display:inline-block;background:var(--teal-soft);color:#14554C;border-radius:4px;padding:0 8px;font-size:13px;margin:3px 0 3px 6px}
.tag.sun{background:var(--sun-soft);color:#7A4E07}
.tag.warn{background:#F6DDD7;color:#7E2C1C}
.tag .x{background:none;border:0;color:inherit;font-size:16px;cursor:pointer;padding:0 2px 0 0}
label{display:block;font-size:14px;color:var(--muted);margin-top:12px}
input,select,textarea{display:block;font:inherit;width:100%;padding:10px 12px;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--teal)}
.form{margin-top:22px;padding-top:6px;border-top:2px solid var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>*{margin-top:0}
.btn{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.btn.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
.btn.big{width:100%;padding:14px;font-size:17px}
.link{background:none;border:0;color:var(--teal);font:inherit;font-size:14px;cursor:pointer;padding:0}
.link.bad{color:var(--brick)}
.chk{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:14px}
.chk input{width:20px;height:20px;margin:0;padding:0;accent-color:var(--teal)}
.hist{margin-top:8px;padding:8px 12px;background:#E6EDEC;border-radius:6px}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.row.done{opacity:.55}.row.done b{text-decoration:line-through}
textarea{resize:vertical}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;background:#E3E9EA;margin:6px 0 2px}
.bar i{display:block;height:100%}
.bar .l{background:#8FA1A7}.bar .a{background:var(--teal)}.bar .o{background:var(--brick)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:6px 0 0;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}
.scale{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#9DB0B6;padding:15px 4px;font:inherit;font-size:15px;cursor:pointer}
nav button[aria-selected=true]{color:#fff;font-weight:800;box-shadow:inset 0 3px 0 var(--sun)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.toast{position:fixed;bottom:84px;inset-inline:0;margin:auto;width:max-content;background:var(--ink);color:#fff;padding:8px 18px;border-radius:6px}
</style>
</head>
<body>
<header>
  <h1>تقسیم کار تیم</h1>
  <p>اعضا و کارها رو وارد کن تا کارها منصفانه بین افراد تقسیم بشن.</p>
</header>
<main id="app"></main>
<nav role="tablist" id="nav"></nav>

<script>
const KEY = 'team-tasks-v1';
const mem = {};
const store = {
  get(){ try { return localStorage.getItem(KEY); } catch (e) { return mem[KEY] || null; } },
  set(v){ try { localStorage.setItem(KEY, v); } catch (e) { mem[KEY] = v; } }
};
let S = null;
try { S = JSON.parse(store.get()); } catch (e) {}
if (!S || !S.members) S = { members: [], tasks: [], growth: 40, result: null };
if (!S.history) S.history = [];
const save = () => store.set(JSON.stringify(S));
const uid = () => Math.random().toString(36).slice(2, 9);
const fa = n => Number(n).toLocaleString('fa-IR');
const LV = { 1: 'مبتدی', 2: 'متوسط', 3: 'مسلط' };
const PR = { 1: 'کم', 2: 'متوسط', 3: 'زیاد' };
const newM = () => ({ id: null, name: '', hours: 10, load: 0, skills: [], interests: '', support: false, active: false, away: false });
const newT = () => ({ title: '', skill: '', hours: 2, priority: 2 });
let tab = 'members', dm = newM(), dt = newT();

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(c));
  }
  return e;
}
function toast(t) {
  const e = h('div', { class: 'toast' }, t);
  document.body.append(e);
  setTimeout(() => e.remove(), 1800);
}
const parseList = s => s.split(/[,،]/).map(x => x.trim()).filter(Boolean);
function setDone(t) {
  S.history = (S.history || []).filter(e => e.tid !== t.id);
  if (t.done && t.assignee) S.history.push({ tid: t.id, memberId: t.assignee, title: t.title, skill: t.skill, hours: t.hours, at: Date.now() });
}
const effLoad = m => m.load + S.tasks.filter(t => t.assignee === m.id && !t.done).reduce((a, t) => a + t.hours, 0);

/* ---------- اعضا ---------- */
let histOpen = null;
const dateFa = ts => ts ? new Date(ts).toLocaleDateString('fa-IR') : '';
function dropFromResult(mid, reason) {
  if (!S.result) return;
  S.result.order.forEach(id => {
    const a = S.result.map[id];
    if (a && a.memberId === mid) S.result.map[id] = { memberId: null, reasons: [reason] };
  });
}
function setAway(m, v) {
  m.away = v;
  if (v) dropFromResult(m.id, 'در دسترس نیست');
  save();
  if (v && S.result) assign(true);
  render();
}
function histView(list) {
  const box = h('div', { class: 'hist' });
  if (!list.length) { box.append(h('span', { class: 'muted' }, 'هنوز کاری برای این فرد ثبت نشده.')); return box; }
  const month = list.filter(e => Date.now() - e.at <= WIN).reduce((a, e) => a + e.hours, 0);
  box.append(h('div', { class: 'muted' }, `${fa(month)} ساعت کار انجام‌شده تو ۳۰ روز اخیر`));
  list.slice(0, 10).forEach(e => box.append(h('div', { class: 'hrow' },
    h('span', {}, e.title + (e.skill ? ' (' + e.skill + ')' : '')),
    h('span', { class: 'muted' }, `${fa(e.hours)} ساعت، ${dateFa(e.at)}`))));
  return box;
}
function viewMembers() {
  const box = h('div');
  box.append(h('h2', {}, 'اعضای تیم'));
  if (!S.members.length) {
    box.append(h('p', { class: 'empty' }, 'هنوز عضوی اضافه نشده. از فرم پایین شروع کن، یا اول با داده نمونه امتحانش کن.'));
    box.append(h('button', { class: 'btn ghost', onclick: loadSample }, 'امتحان با داده نمونه'));
  }
  S.members.forEach(m => {
    const hist = (S.history || []).filter(e => e.memberId === m.id).sort((a, b) => b.at - a.at);
    box.append(h('div', { class: 'row' },
      h('div', { class: 'top' },
        h('b', {}, m.name),
        h('span', { class: 'muted' }, `${fa(Math.max(0, m.hours - effLoad(m)))} ساعت آزاد از ${fa(m.hours)}`)),
      h('div', {},
        m.support ? h('span', { class: 'tag sun' }, m.active ? 'پشتیبان (فعال)' : 'پشتیبان') : null,
        m.away ? h('span', { class: 'tag warn' }, 'در دسترس نیست') : null,
        m.skills.map(s => h('span', { class: 'tag' }, `${s.name} (${LV[s.level]})`)),
        m.interests.map(i => h('span', { class: 'tag sun' }, 'علاقه: ' + i))),
      h('div', { class: 'acts' },
        h('button', { class: 'link', onclick: () => {
          dm = { ...m, skills: m.skills.map(s => ({ ...s })), interests: m.interests.join('، ') };
          render(); window.scrollTo(0, document.body.scrollHeight);
        } }, 'ویرایش'),
        h('button', { class: 'link', onclick: () => { histOpen = histOpen === m.id ? null : m.id; render(); } }, `تاریخچه (${fa(hist.length)})`),
        h('button', { class: 'link', onclick: () => setAway(m, !m.away) }, m.away ? 'برگشت به تیم' : 'در دسترس نیست'),
        h('button', { class: 'link bad', onclick: () => {
          if (confirm('این عضو حذف بشه؟')) {
            S.members = S.members.filter(x => x.id !== m.id);
            S.history = (S.history || []).filter(e => e.memberId !== m.id);
            S.result = null; save(); render();
          }
        } }, 'حذف')),
      histOpen === m.id ? histView(hist) : null
    ));
  });
  box.append(memberForm());
  return box;
}
function memberForm() {
  const d = dm;
  const name = h('input', { placeholder: 'مثلاً سارا', oninput: e => d.name = e.target.value }); name.value = d.name;
  const hours = h('input', { type: 'number', min: 0, inputmode: 'numeric', oninput: e => d.hours = +e.target.value || 0 }); hours.value = d.hours;
  const load = h('input', { type: 'number', min: 0, inputmode: 'numeric', oninput: e => d.load = +e.target.value || 0 }); load.value = d.load;
  const intr = h('input', { placeholder: 'مثلاً طراحی، نوشتن', oninput: e => d.interests = e.target.value }); intr.value = d.interests;
  const sup = h('input', { type: 'checkbox', onchange: e => d.support = e.target.checked }); sup.checked = !!d.support;
  const away = h('input', { type: 'checkbox', onchange: e => d.away = e.target.checked }); away.checked = !!d.away;
  const skName = h('input', { placeholder: 'مثلاً طراحی' });
  const skLv = h('select', {}, [1, 2, 3].map(v => h('option', { value: v }, LV[v]))); skLv.value = 2;
  const pushSkill = () => {
    const n = skName.value.trim(); if (!n) return false;
    d.skills = d.skills.filter(s => s.name !== n);
    d.skills.push({ name: n, level: +skLv.value }); return true;
  };
  const chips = h('div', {}, d.skills.map((s, i) =>
    h('span', { class: 'tag' }, `${s.name} (${LV[s.level]})`,
      h('button', { class: 'x', 'aria-label': 'حذف مهارت', onclick: () => { d.skills.splice(i, 1); render(); } }, '×'))));
  return h('div', { class: 'form' },
    h('h2', {}, d.id ? 'ویرایش عضو' : 'افزودن عضو'),
    h('label', {}, 'نام', name),
    h('div', { class: 'grid2' },
      h('label', {}, 'ساعت در دسترس در هفته', hours),
      h('label', {}, 'ساعت کار دیگه‌ای که الان دارد', load)),
    h('label', {}, 'مهارت‌ها'),
    chips,
    h('div', { class: 'inline' },
      h('div', { style: 'flex:2' }, skName),
      h('div', { style: 'flex:1' }, skLv),
      h('button', { class: 'btn ghost', style: 'margin:0', onclick: () => { if (pushSkill()) render(); } }, 'افزودن')),
    h('label', {}, 'علاقه‌ها (با ویرگول جدا کن)', intr),
    h('label', { class: 'chk', style: 'margin-top:16px' }, sup, 'نیروی پشتیبان (فقط وقتی فعالش کنی تو تقسیم شرکت می‌کنه)'),
    h('label', { class: 'chk', style: 'margin-top:10px' }, away, 'فعلاً در دسترس نیست'),
    h('button', { class: 'btn', onclick: () => {
      if (!d.name.trim()) { toast('اسم عضو رو بنویس'); return; }
      pushSkill();
      const m = {
        id: d.id || uid(), name: d.name.trim(), hours: d.hours, load: d.load, skills: d.skills,
        interests: parseList(d.interests), support: !!d.support, active: d.support ? !!d.active : false, away: !!d.away
      };
      const i = S.members.findIndex(x => x.id === m.id);
      if (i >= 0) S.members[i] = m; else S.members.push(m);
      dm = newM(); S.result = null; save(); render(); toast('ذخیره شد');
    } }, d.id ? 'ذخیره تغییرات' : 'افزودن عضو'),
    d.id ? h('button', { class: 'btn ghost', style: 'margin-inline-start:8px', onclick: () => { dm = newM(); render(); } }, 'انصراف') : null
  );
}

/* ---------- کارها ---------- */
function viewTasks() {
  const box = h('div');
  box.append(h('h2', {}, 'کارها'));
  if (!S.tasks.length) box.append(h('p', { class: 'empty' }, 'هنوز کاری اضافه نشده.'));
  const nameOf = id => { const m = S.members.find(x => x.id === id); return m ? m.name : null; };
  const row = t => {
    const who = t.assignee ? nameOf(t.assignee) : null;
    const cb = h('input', { type: 'checkbox', onchange: e => { t.done = e.target.checked; setDone(t); S.result = null; save(); render(); } });
    cb.checked = !!t.done;
    return h('div', { class: 'row' + (t.done ? ' done' : '') },
      h('div', { class: 'top' },
        h('b', {}, t.title),
        h('span', { class: 'muted' }, `${fa(t.hours)} ساعت، اولویت ${PR[t.priority]}`)),
      h('div', {},
        t.skill ? h('span', { class: 'tag' }, 'مهارت لازم: ' + t.skill) : null,
        who ? h('span', { class: 'tag sun' }, 'مسئول: ' + who) : (t.done ? null : h('span', { class: 'tag warn' }, 'بدون مسئول'))),
      h('div', { class: 'acts' },
        h('label', { class: 'chk' }, cb, 'انجام شد'),
        (t.assignee && !t.done) ? h('button', { class: 'link', onclick: () => { t.assignee = null; S.result = null; save(); render(); } }, 'لغو مسئول') : null,
        h('button', { class: 'link bad', onclick: () => {
          S.tasks = S.tasks.filter(x => x.id !== t.id); S.result = null; save(); render();
        } }, 'حذف')));
  };
  S.tasks.filter(t => !t.done).forEach(t => box.append(row(t)));
  const doneList = S.tasks.filter(t => t.done);
  if (doneList.length) {
    box.append(h('h2', {}, `انجام‌شده (${fa(doneList.length)})`));
    doneList.forEach(t => box.append(row(t)));
  }
  box.append(taskForm());
  return box;
}
function taskForm() {
  const d = dt;
  const skills = [...new Set(S.members.flatMap(m => m.skills.map(s => s.name)))];
  const title = h('input', { placeholder: 'مثلاً طراحی پوستر', oninput: e => d.title = e.target.value }); title.value = d.title;
  const skill = h('input', { list: 'skl', placeholder: 'اختیاری', oninput: e => d.skill = e.target.value }); skill.value = d.skill;
  const dl = h('datalist', { id: 'skl' }, skills.map(s => h('option', { value: s })));
  const hours = h('input', { type: 'number', min: 1, inputmode: 'numeric', oninput: e => d.hours = +e.target.value || 1 }); hours.value = d.hours;
  const pr = h('select', { onchange: e => d.priority = +e.target.value }, [1, 2, 3].map(v => h('option', { value: v }, PR[v]))); pr.value = d.priority;
  return h('div', { class: 'form' },
    h('h2', {}, 'افزودن کار'),
    h('label', {}, 'عنوان کار', title),
    h('label', {}, 'مهارت لازم', skill, dl),
    h('div', { class: 'grid2' },
      h('label', {}, 'ساعت لازم', hours),
      h('label', {}, 'اولویت', pr)),
    h('button', { class: 'btn', onclick: () => {
      if (!d.title.trim()) { toast('عنوان کار رو بنویس'); return; }
      S.tasks.push({ id: uid(), title: d.title.trim(), skill: d.skill.trim(), hours: d.hours, priority: d.priority });
      dt = newT(); S.result = null; save(); render(); toast('کار اضافه شد');
    } }, 'افزودن کار'));
}

/* ---------- تقسیم ---------- */
const WIN = 30 * 24 * 3600 * 1000;
const WARN = ['ظرفیت کافی نیست', 'تکرار کار اخیر', 'در دسترس نیست', 'پشتیبان غیرفعال شد'];
const avail = m => !m.away && (!m.support || m.active);
const recentOf = mid => (S.history || []).filter(e => e.memberId === mid && Date.now() - e.at <= WIN);
const sumH = list => list.reduce((a, e) => a + e.hours, 0);
const vv = () => S.variety == null ? 40 : S.variety;

function assign(keep) {
  const av = S.members.filter(avail);
  const free = {};
  av.forEach(m => free[m.id] = Math.max(0, m.hours - effLoad(m)));
  const prev = keep ? S.result : null;
  const map = {};
  let order, todo = [];
  if (prev) {
    order = prev.order.filter(id => S.tasks.some(t => t.id === id));
    order.forEach(id => {
      const a = prev.map[id], t = S.tasks.find(x => x.id === id);
      if (a && a.memberId) { map[id] = a; if (free[a.memberId] != null) free[a.memberId] -= t.hours; }
      else todo.push(t);
    });
  } else {
    todo = S.tasks.filter(t => !t.assignee && !t.done);
  }
  todo.sort((a, b) => b.priority - a.priority || b.hours - a.hours);
  if (!prev) order = todo.map(t => t.id);
  const maxFree = Math.max(1, ...Object.values(free));
  const maxRec = Math.max(1, ...av.map(m => sumH(recentOf(m.id))));
  const g = S.growth / 100, v = vv() / 100;
  todo.forEach(t => {
    const sk = t.skill.trim();
    let best = null;
    av.forEach(m => {
      if (free[m.id] < t.hours) return;
      const found = sk ? m.skills.find(s => s.name === sk) : null;
      const lv = sk ? (found ? found.level : 0) : null;
      const interested = m.interests.some(i => i === sk || t.title.includes(i));
      let eff, grow;
      if (lv === null) { eff = .5; grow = .5; }
      else { eff = lv / 3; grow = lv === 0 ? (interested ? .8 : .3) : (3 - lv) / 3; }
      const rec = recentOf(m.id);
      const titleRep = rec.some(e => e.title.trim() === t.title.trim());
      const skRep = sk ? Math.min(3, rec.filter(e => e.skill === sk).length) / 3 : 0;
      const pen = Math.max(titleRep ? 1 : 0, skRep * .7);
      const score = .55 * ((1 - g) * eff + g * grow) + (interested ? .15 : 0) + .30 * (free[m.id] / maxFree)
        - .6 * v * pen - .10 * (sumH(rec) / maxRec);
      if (!best || score > best.score) best = { m, score, lv, interested, ratio: free[m.id] / maxFree, titleRep, pen, hasHist: rec.length > 0 };
    });
    if (!best) { map[t.id] = { memberId: null, reasons: ['ظرفیت کافی نیست'] }; return; }
    const r = [];
    if (best.lv === 3) r.push('مهارت بالا');
    else if (best.lv > 0 && g >= .3) r.push('فرصت رشد');
    if (best.lv === 0) r.push(best.interested ? 'علاقه‌مند به مهارت جدید' : 'تجربه جدید');
    else if (best.interested) r.push('مورد علاقه');
    if (best.ratio >= .6) r.push('زمان آزاد زیاد');
    if (best.titleRep) r.push('تکرار کار اخیر');
    else if (best.hasHist && best.pen === 0) r.push('تکراری نیست');
    if (!r.length) r.push('مناسب‌ترین گزینه');
    free[best.m.id] -= t.hours;
    map[t.id] = { memberId: best.m.id, reasons: r };
  });
  S.result = { order, map };
  save();
}
function growthText() { return S.growth <= 20 ? 'بیشتر کارایی' : S.growth >= 70 ? 'بیشتر یادگیری' : 'متعادل'; }
function varText() { return vv() <= 20 ? 'کم‌اهمیت' : vv() >= 70 ? 'خیلی مهم' : 'متوسط'; }

function viewAssign() {
  const box = h('div');
  box.append(h('h2', {}, 'تقسیم کار'));
  const pool = S.tasks.filter(t => !t.assignee && !t.done);
  if (!S.members.length || !pool.length) {
    box.append(h('p', { class: 'empty' }, (!S.members.length || !S.tasks.length)
      ? 'اول حداقل یک عضو و یک کار اضافه کن.'
      : 'همه کارها مسئول دارن یا انجام شدن. یه کار جدید اضافه کن.'));
    return box;
  }
  const lab = h('b', {}, growthText());
  const rg = h('input', { type: 'range', min: 0, max: 100, step: 10, oninput: e => { S.growth = +e.target.value; lab.textContent = growthText(); save(); } });
  rg.value = S.growth;
  const vlab = h('b', {}, varText());
  const rv = h('input', { type: 'range', min: 0, max: 100, step: 10, oninput: e => { S.variety = +e.target.value; vlab.textContent = varText(); save(); } });
  rv.value = vv();
  box.append(
    h('label', {}, 'تعادل بین کارایی و یادگیری: ', lab, rg),
    h('div', { class: 'scale' }, h('span', {}, 'کارایی'), h('span', {}, 'یادگیری')),
    h('p', { class: 'muted' }, 'هرچه به سمت یادگیری بره، کار بیشتر به کسی داده می‌شه که تجربه‌اش کمتره.'),
    h('label', {}, 'اهمیت پرهیز از کار تکراری: ', vlab, rv),
    h('div', { class: 'scale' }, h('span', {}, 'کم'), h('span', {}, 'زیاد')),
    h('p', { class: 'muted' }, 'کاری که یک نفر تو ۳۰ روز اخیر انجام داده، کمتر بهش داده می‌شه. هرچه این عدد بالاتر باشه، کارها بیشتر بین افراد می‌چرخه.'),
    h('button', { class: 'btn big', onclick: () => { assign(false); render(); } }, S.result ? 'تقسیم دوباره' : 'تقسیم کن')
  );

  const sups = S.members.filter(m => m.support && !m.away);
  if (sups.length) {
    const left = S.result ? S.result.order.filter(id => S.result.map[id] && !S.result.map[id].memberId).length : 0;
    box.append(h('h2', {}, 'نیروهای پشتیبان'),
      h('p', { class: left ? 'bad-t' : 'muted' }, left
        ? `${fa(left)} کار ظرفیت نداشت. با فعال کردن پشتیبان‌ها، فقط همین کارها دوباره تقسیم می‌شن.`
        : 'هر پشتیبانی که فعال کنی تو تقسیم شرکت می‌کنه. اگه تقسیم انجام شده باشه، فقط کارهای بدون مسئول رو می‌گیره.'));
    sups.forEach(m => {
      const cb = h('input', { type: 'checkbox', onchange: e => {
        m.active = e.target.checked;
        if (!m.active) dropFromResult(m.id, 'پشتیبان غیرفعال شد');
        save();
        if (S.result) assign(true);
        render();
      } });
      cb.checked = !!m.active;
      box.append(h('div', { class: 'row top' },
        h('label', { class: 'chk' }, cb, `${m.name}: فعال`),
        h('span', { class: 'muted' }, `${fa(Math.max(0, m.hours - effLoad(m)))} ساعت آزاد`)));
    });
  }
  if (!S.result) return box;

  const asg = {}; S.members.forEach(m => asg[m.id] = 0);
  S.result.order.forEach(id => {
    const a = S.result.map[id], t = S.tasks.find(x => x.id === id);
    if (a && a.memberId && t && asg[a.memberId] != null) asg[a.memberId] += t.hours;
  });

  box.append(h('h2', {}, 'نتیجه'));
  S.result.order.forEach(id => {
    const t = S.tasks.find(x => x.id === id), a = S.result.map[id];
    if (!t || !a) return;
    const sel = h('select', { onchange: e => {
      S.result.map[id] = { memberId: e.target.value || null, reasons: ['انتخاب دستی'] }; save(); render();
    } }, h('option', { value: '' }, 'بدون مسئول'),
      S.members.map(m => h('option', { value: m.id }, m.name + (m.away ? ' (در دسترس نیست)' : (m.support && !m.active ? ' (پشتیبان)' : '')))));
    sel.value = a.memberId || '';
    box.append(h('div', { class: 'row' },
      h('div', { class: 'top' }, h('b', {}, t.title), h('span', { class: 'muted' }, `${fa(t.hours)} ساعت`)),
      sel,
      h('div', {}, a.reasons.map(r => h('span', { class: 'tag' + (WARN.includes(r) ? ' warn' : '') }, r)))));
  });

  box.append(h('h2', {}, 'بار کاری هر نفر'),
    h('div', { class: 'legend' },
      h('span', {}, h('b', { style: 'background:#8FA1A7' }), 'کار فعلی'),
      h('span', {}, h('b', { style: 'background:var(--teal)' }), 'کار جدید'),
      h('span', {}, h('b', { style: 'background:#E3E9EA' }), 'زمان آزاد')));
  S.members.filter(m => avail(m) || asg[m.id] > 0).forEach(m => {
    const base = effLoad(m), used = base + asg[m.id], scale = Math.max(m.hours, used, 1), over = used > m.hours;
    box.append(h('div', { class: 'row' },
      h('div', { class: 'top' }, h('b', {}, m.name),
        h('span', { class: over ? 'bad-t' : 'muted' }, over ? `${fa(used - m.hours)} ساعت بیش از ظرفیت` : `${fa(asg[m.id])} ساعت کار جدید`)),
      h('div', { class: 'bar' },
        h('i', { class: 'l', style: `width:${base / scale * 100}%` }),
        h('i', { class: over ? 'o' : 'a', style: `width:${asg[m.id] / scale * 100}%` }))));
  });
  const out = S.members.filter(m => !avail(m));
  if (out.length) box.append(h('p', { class: 'muted' }, 'در تقسیم شرکت نمی‌کنن: ' + out.map(m => m.name + (m.away ? ' (در دسترس نیست)' : ' (پشتیبان)')).join('، ')));

  box.append(h('button', { class: 'btn big', onclick: () => {
    let n = 0;
    S.result.order.forEach(id => {
      const a = S.result.map[id], t = S.tasks.find(x => x.id === id);
      if (t && a && a.memberId) { t.assignee = a.memberId; n++; }
    });
    S.result = null; save(); tab = 'tasks'; render(); window.scrollTo(0, 0);
    toast(`${fa(n)} کار ثبت شد`);
  } }, 'تایید و ثبت تقسیم'));
  box.append(h('button', { class: 'btn ghost big', onclick: () => {
    const text = S.result.order.map(id => {
      const t = S.tasks.find(x => x.id === id), a = S.result.map[id];
      const m = S.members.find(x => x.id === a.memberId);
      return `• ${t.title}: ${m ? m.name : 'بدون مسئول'}`;
    }).join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => toast('کپی شد'), () => prompt('این متن رو کپی کن:', text));
    } else prompt('این متن رو کپی کن:', text);
  } }, 'کپی لیست برای ارسال در پیام‌رسان'));
  return box;
}

/* ---------- پشتیبان ---------- */
function viewBackup() {
  const box = h('div');
  const data = () => JSON.stringify({ members: S.members, tasks: S.tasks, growth: S.growth, variety: S.variety, history: S.history }, null, 1);
  const stamp = () => { S.lastBackup = Date.now(); save(); };
  box.append(
    h('h2', {}, 'پشتیبان‌گیری'),
    h('p', { class: 'muted' }, 'اطلاعات فقط روی همین مرورگر ذخیره می‌شن. اگه داده‌های مرورگر پاک بشه، همه‌چیز از بین می‌ره. هر چند وقت یه بار پشتیبان بگیر.'),
    h('p', { class: 'muted' }, S.lastBackup ? 'آخرین پشتیبان: ' + new Date(S.lastBackup).toLocaleDateString('fa-IR') : 'هنوز پشتیبان نگرفتی.'),
    h('button', { class: 'btn big', onclick: () => {
      const url = URL.createObjectURL(new Blob([data()], { type: 'application/json' }));
      const a = h('a', { href: url, download: 'team-tasks-backup.json' });
      document.body.append(a); a.click(); a.remove();
      stamp(); render(); toast('فایل پشتیبان ساخته شد');
    } }, 'دانلود فایل پشتیبان'),
    h('button', { class: 'btn ghost big', onclick: () => {
      const t = data(); stamp();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(() => toast('کپی شد'), () => prompt('این متن رو کپی کن:', t));
      } else prompt('این متن رو کپی کن:', t);
    } }, 'کپی پشتیبان به‌صورت متن'));

  const restore = text => {
    let d;
    try { d = JSON.parse(text); } catch (e) { toast('فایل معتبر نیست'); return; }
    if (!d || !Array.isArray(d.members) || !Array.isArray(d.tasks)) { toast('فایل معتبر نیست'); return; }
    if (!confirm('اطلاعات فعلی با پشتیبان جایگزین بشه؟')) return;
    S = { members: d.members, tasks: d.tasks, growth: typeof d.growth === 'number' ? d.growth : 40, variety: typeof d.variety === 'number' ? d.variety : 40, history: Array.isArray(d.history) ? d.history : [], result: null, lastBackup: S.lastBackup };
    save(); render(); toast('بازیابی شد');
  };
  const file = h('input', { type: 'file', accept: '.json,application/json', onchange: e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(f);
  } });
  const ta = h('textarea', { rows: 4, placeholder: 'متن پشتیبان رو اینجا بچسبون' });
  box.append(h('div', { class: 'form' },
    h('h2', {}, 'بازیابی'),
    h('label', {}, 'از فایل پشتیبان', file),
    h('label', {}, 'یا از متن پشتیبان', ta),
    h('button', { class: 'btn', onclick: () => restore(ta.value) }, 'بازیابی از متن')));
  return box;
}

/* ---------- نمونه و رندر ---------- */
function loadSample() {
  S.members = [
    { id: uid(), name: 'سارا', hours: 10, load: 3, skills: [{ name: 'طراحی', level: 3 }, { name: 'نوشتن', level: 1 }], interests: ['نوشتن'] },
    { id: uid(), name: 'علی', hours: 8, load: 5, skills: [{ name: 'برنامه‌نویسی', level: 3 }, { name: 'طراحی', level: 1 }], interests: ['طراحی'] },
    { id: uid(), name: 'مریم', hours: 6, load: 1, skills: [{ name: 'نوشتن', level: 3 }], interests: [] },
    { id: uid(), name: 'رضا', hours: 12, load: 2, skills: [], interests: ['برنامه‌نویسی'] }
  ];
  S.tasks = [
    { id: uid(), title: 'طراحی لوگو', skill: 'طراحی', hours: 4, priority: 2 },
    { id: uid(), title: 'نوشتن متن معرفی', skill: 'نوشتن', hours: 3, priority: 2 },
    { id: uid(), title: 'راه‌اندازی سایت', skill: 'برنامه‌نویسی', hours: 6, priority: 3 },
    { id: uid(), title: 'هماهنگی جلسه', skill: '', hours: 1, priority: 1 }
  ];
  S.history = []; S.result = null; save(); render();
}
const TABS = [['members', 'اعضا'], ['tasks', 'کارها'], ['assign', 'تقسیم'], ['backup', 'پشتیبان']];
function render() {
  const app = document.getElementById('app');
  app.replaceChildren(tab === 'members' ? viewMembers() : tab === 'tasks' ? viewTasks() : tab === 'assign' ? viewAssign() : viewBackup());
  document.getElementById('nav').replaceChildren(...TABS.map(([k, t]) =>
    h('button', { role: 'tab', 'aria-selected': String(tab === k), onclick: () => { tab = k; render(); window.scrollTo(0, 0); } }, t)));
}
render();
</script>
